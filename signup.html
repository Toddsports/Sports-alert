<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Alert Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #003087;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
        }

        label {
            display: block;
            margin: 8px 0;
        }

        input[type=text],
        input[type=tel] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        .small {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<h1>Sports Alert Signup</h1>

<p>
Receive live sports alerts by SMS.
</p>

<form>

<label>
Phone Number
<input type="tel" placeholder="(555) 555-5555">
</label>

<fieldset>

<legend>Select Teams</legend>

<label><input type="checkbox"> Yankees</label>
<label><input type="checkbox"> Bills</label>
<label><input type="checkbox"> Warriors</label>
<label><input type="checkbox"> Sabres</label>

</fieldset>

<fieldset>

<legend>Alert Types</legend>

<label><input type="checkbox"> Game Start</label>
<label><input type="checkbox"> Score Updates</label>
<label><input type="checkbox"> Final Score</label>
<label><input type="checkbox"> Breaking News</label>
<label><input type="checkbox"> Injury Alerts</label>

</fieldset>

<label>

<input type="checkbox">

I agree to receive recurring SMS sports alerts.
Message frequency varies.
Message and data rates may apply.
Reply STOP to opt out and HELP for help.

</label>

<p>

<a href="privacy.html">Privacy Policy</a>

|<button type="button">
Subscribe (Prototype)
</button>

<p><em>Prototype signup page for Sports Alert. This page demonstrates the SMS consent process for campaign review.</em></p>
<a href="terms.html">Terms of Service</a>

</p>



</form>

</body>
</html>
